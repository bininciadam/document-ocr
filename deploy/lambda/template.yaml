AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: document-ocr — passport / KYC OCR pipeline on AWS Lambda (container image)

Globals:
  Function:
    Timeout: 60
    MemorySize: 2048

Resources:
  DocumentOcrFunction:
    Type: AWS::Serverless::Function
    Metadata:
      Dockerfile: Dockerfile.lambda
      DockerContext: ../..
      DockerTag: document-ocr-lambda
    Properties:
      PackageType: Image
      Architectures:
        - x86_64
      # IAM-authenticated direct invoke is the supported default. Add an API
      # Gateway event explicitly only when an authentication layer is present.

Outputs:
  FunctionName:
    Description: Lambda function name (use with the SDK's mode:'lambda')
    Value: !Ref DocumentOcrFunction
  FunctionArn:
    Value: !GetAtt DocumentOcrFunction.Arn
